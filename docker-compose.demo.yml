# Demo-only overlay, layered on top of docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up nginx
#
# Unlike the tests (which use the cut-down nginx_stub in docker-compose.yml),
# the demo runs the REAL cyber-dojo nginx and the full set of services it
# routes to, so you can create a group/kata in creator and then edit it in
# web. Bringing up nginx cascades (via depends_on) to web, creator, differ,
# dashboard and the services they need. See bin/demo.sh.

services:

  nginx:
    image: ${CYBER_DOJO_NGINX_IMAGE}:${CYBER_DOJO_NGINX_TAG}
    platform: linux/amd64
    user: root
    init: true
    ports: [ "${CYBER_DOJO_NGINX_HOST_PORT:-81}:80" ]
    restart: "no"
    depends_on:
      - web
      - creator
      - differ
      - dashboard

  # Publish creator on the host for the demo only. bin/demo.sh's api_demo
  # curls the creator server directly on CYBER_DOJO_CREATOR_PORT (not through
  # nginx) to bypass nginx's /creator/ rate-limit. The base docker-compose.yml
  # deliberately publishes no host ports (see its comment).
  creator:
    ports: [ "${CYBER_DOJO_CREATOR_PORT}:${CYBER_DOJO_CREATOR_PORT}" ]

  web:
    image: ${CYBER_DOJO_WEB_IMAGE}:${CYBER_DOJO_WEB_TAG}
    platform: linux/amd64
    user: nobody
    env_file: [ .env, web.env ]
    read_only: true
    tmpfs: /tmp
    restart: "no"
    depends_on:
      - creator
      - dashboard
      - differ
      - runner
      - saver
      - spooler

  # web's async write path. web POSTs its event writes (kata_file_create ...
  # kata_checked_out) to the spooler, which durably buffers them and drains
  # them on to the saver in tab_seq order. Without it those writes never reach
  # the saver, so a traffic-light shows in the browser but vanishes on refresh.
  # web reaches it at hostname 'spooler' on CYBER_DOJO_SPOOLER_PORT (in .env).
  # It buffers into its own /sqlite volume, owned by uid 19664 (the spooler
  # user), separate from the saver's /cyber-dojo.
  spooler:
    image: ${CYBER_DOJO_SPOOLER_IMAGE}:${CYBER_DOJO_SPOOLER_TAG}
    platform: linux/amd64
    user: spooler
    env_file: [ .env ]
    read_only: true
    restart: "no"
    depends_on:
      - saver
    tmpfs:
      - /sqlite:uid=19664,gid=65533
      - /tmp

  differ:
    image: ${CYBER_DOJO_DIFFER_IMAGE}:${CYBER_DOJO_DIFFER_TAG}
    platform: linux/amd64
    user: nobody
    env_file: [ .env ]
    read_only: true
    tmpfs: /tmp
    restart: "no"
    depends_on:
      - saver

  dashboard:
    image: ${CYBER_DOJO_DASHBOARD_IMAGE}:${CYBER_DOJO_DASHBOARD_TAG}
    platform: linux/amd64
    user: nobody
    env_file: [ .env ]
    read_only: true
    tmpfs: /tmp
    restart: "no"
    depends_on:
      - saver
